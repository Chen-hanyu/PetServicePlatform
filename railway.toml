# Railway 部署配置 - 后端服务
# 文档: https://docs.railway.app/develop/reference

[build]
  # 使用 Nixpacks 自动检测 Dockerfile 构建
  builder = "DOCKERFILE"
  # Dockerfile 路径（相对于项目根目录）
  dockerfilePath = "backend/Dockerfile"
  # 构建上下文目录（使用项目根目录，Dockerfile 使用 backend/ 前缀路径）
  buildContext = "."

[deploy]
  # 健康检查路径
  healthcheckPath = "/health"
  # 健康检查超时时间（秒）
  healthcheckTimeout = 30
  # 重启策略
  restartPolicyType = "ON_FAILURE"
  # 最大重启次数
  restartPolicyMaxRetries = 3
  # 服务端口
  port = 8080
  # 启动命令（覆盖 Dockerfile 中的 ENTRYPOINT）
  # startCommand = "java -jar /app/app.jar"
