openapi: 3.0.3
info:
  title: Pet Service Platform API
  version: 1.0.0
  description: 宠物综合服务平台后端接口规范
servers:
  - url: http://127.0.0.1:8080
    description: Local development server
tags:
  - name: Home
    description: 首页接口
  - name: Search
    description: 搜索接口
  - name: Auth
    description: 用户认证接口
  - name: Profile
    description: 个人中心接口
  - name: Community
    description: 社区接口
  - name: Adoption
    description: 领养接口
  - name: Services
    description: 服务接口
  - name: Shop
    description: 商城接口
  - name: Messages
    description: 消息接口
  - name: Pets
    description: 宠物档案接口
  - name: Files
    description: 文件接口
  - name: Admin Auth
    description: 管理员认证接口
  - name: Admin Dashboard
    description: 管理端仪表盘接口
  - name: Admin Users
    description: 管理端用户接口
  - name: Admin Community
    description: 管理端社区审核接口
  - name: Admin Adoption
    description: 管理端领养接口
  - name: Admin Services
    description: 管理端服务接口
  - name: Admin Shop
    description: 管理端商城接口
  - name: Admin Content
    description: 管理端 Banner、标签与推荐位接口
paths:
  /api/v1/home:
    get:
      tags: [Home]
      summary: 获取首页聚合数据
      security: []
      responses:
        '200':
          description: 成功，data 为 HomeResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'

  /api/v1/search:
    get:
      tags: [Search]
      summary: 全站搜索
      security: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [community, adoption, services, shop]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<SearchResultResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 用户注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 手机号已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'

  /api/v1/auth/verify-code:
    post:
      tags: [Auth]
      summary: 发送验证码
      description: 当前系统已切换为密码登录，验证码接口保留用于调试与联调
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendVerifyCodeRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVerifyCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 用户密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 用户登出
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/profile/me:
    get:
      tags: [Profile]
      summary: 获取当前用户信息
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功，data 为 UserProfileResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/profile/overview:
    get:
      tags: [Profile]
      summary: 获取个人中心概览
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功，data 为 ProfileOverviewResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/community/posts:
    get:
      tags: [Community]
      summary: 获取帖子列表
      security: []
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [recommended, latest]
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<PostSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Community]
      summary: 发布帖子
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '200':
          description: 成功，data 为 CreatePostResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/community/posts/{postId}:
    get:
      tags: [Community]
      summary: 获取帖子详情
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 成功，data 为 PostDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/community/posts/{postId}/comments:
    get:
      tags: [Community]
      summary: 获取评论列表
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize100'
      responses:
        '200':
          description: 成功，data 为 PageResponse<PostCommentResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
    post:
      tags: [Community]
      summary: 发表评论
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 成功，data 为 CreateCommentResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/community/posts/{postId}/like:
    post:
      tags: [Community]
      summary: 点赞或取消点赞
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 成功，data 为 ToggleLikeResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/community/posts/{postId}/favorite:
    post:
      tags: [Community]
      summary: 收藏或取消收藏
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 成功，data 为 ToggleFavoriteResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/adoption/pets:
    get:
      tags: [Adoption]
      summary: 获取待领养宠物列表
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<AdoptionPetSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'

  /api/v1/adoption/pets/{petId}:
    get:
      tags: [Adoption]
      summary: 获取待领养宠物详情
      security: []
      parameters:
        - $ref: '#/components/parameters/PetId'
      responses:
        '200':
          description: 成功，data 为 AdoptionPetDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/adoption/process:
    get:
      tags: [Adoption]
      summary: 获取领养流程说明
      security: []
      responses:
        '200':
          description: 成功，data 为 AdoptionProcessResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'

  /api/v1/adoption/applications:
    post:
      tags: [Adoption]
      summary: 提交领养申请
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdoptionApplicationRequest'
      responses:
        '200':
          description: 成功，data 为 CreateAdoptionApplicationResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Adoption]
      summary: 获取我的领养申请列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<AdoptionApplicationSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/services/categories:
    get:
      tags: [Services]
      summary: 获取服务分类
      security: []
      responses:
        '200':
          description: 成功，data 为 ServiceCategoryResponse[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseArray'

  /api/v1/services/merchants:
    get:
      tags: [Services]
      summary: 获取商家列表
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: district
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<MerchantSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'

  /api/v1/services/merchants/{merchantId}:
    get:
      tags: [Services]
      summary: 获取商家详情
      security: []
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: 成功，data 为 MerchantDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/services/merchants/{merchantId}/reviews:
    post:
      tags: [Services]
      summary: 发表商家评价
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantReviewRequest'
      responses:
        '200':
          description: 成功，data 为 CreateMerchantReviewResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/services/bookings:
    post:
      tags: [Services]
      summary: 创建服务预约
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceBookingRequest'
      responses:
        '200':
          description: 成功，data 为 CreateServiceBookingResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Services]
      summary: 获取我的预约列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<ServiceBookingSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/services/bookings/{bookingId}/cancel:
    post:
      tags: [Services]
      summary: 取消预约
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: 成功，data 为 CancelServiceBookingResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shop/categories:
    get:
      tags: [Shop]
      summary: 获取商品分类
      security: []
      responses:
        '200':
          description: 成功，data 为 ProductCategoryResponse[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseArray'

  /api/v1/shop/products:
    get:
      tags: [Shop]
      summary: 获取商品列表
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: pet_type
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<ProductSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'

  /api/v1/shop/products/{productId}:
    get:
      tags: [Shop]
      summary: 获取商品详情
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 成功，data 为 ProductDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/shop/cart:
    get:
      tags: [Shop]
      summary: 获取购物车
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功，data 为 CartResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/shop/cart/items:
    post:
      tags: [Shop]
      summary: 添加购物车商品
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: 成功，data 为 CartResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/shop/cart/items/{itemId}:
    put:
      tags: [Shop]
      summary: 更新购物车商品
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: 成功，data 为 CartResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/shop/orders:
    post:
      tags: [Shop]
      summary: 创建订单
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: 成功，data 为 OrderSummaryResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Shop]
      summary: 获取我的订单列表
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<OrderSummaryResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/shop/orders/{orderId}:
    get:
      tags: [Shop]
      summary: 获取订单详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 成功，data 为 OrderDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/messages:
    get:
      tags: [Messages]
      summary: 获取消息列表
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize50'
      responses:
        '200':
          description: 成功，data 为 PageResponse<MessageResponse>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/messages/{messageId}/read:
    post:
      tags: [Messages]
      summary: 标记消息已读
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: 成功，data 为 MarkMessageReadResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pets:
    get:
      tags: [Pets]
      summary: 获取我的宠物列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功，data 为 PetProfileResponse[]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseArray'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Pets]
      summary: 创建宠物档案
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePetRequest'
      responses:
        '201':
          description: 创建成功，data 为 PetProfileResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/pets/{petId}:
    get:
      tags: [Pets]
      summary: 获取宠物档案详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PetId'
      responses:
        '200':
          description: 成功，data 为 PetDetailResponse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pets]
      summary: 更新宠物档案
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePetRequest'
      responses:
        '200':
          description: 更新成功，data 为 PetProfileResponse
          content:
            application/json:
              schema:
