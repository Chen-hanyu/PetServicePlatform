components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码
    PageSize50:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      description: 每页数量
    PageSize100:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: 每页数量
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BannerId:
      name: bannerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Unauthorized:
      description: 未登录或登录失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Forbidden:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
  schemas:
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
          example: null
      required: [code, message, data]
    ApiResponseError:
      type: object
      properties:
        code:
          type: integer
          example: 10001
        message:
          type: string
          example: 参数错误
        data:
          nullable: true
          example: null
      required: [code, message, data]
    ApiResponseObject:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/GenericObject'
      required: [code, message, data]
    ApiResponseArray:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
      required: [code, message, data]
    ApiResponsePage:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/PageData'
      required: [code, message, data]
    ApiResponseLoginResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/LoginResponse'
      required: [code, message, data]
    ApiResponseVerifyCodeResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          $ref: '#/components/schemas/SendVerifyCodeResponse'
      required: [code, message, data]
    GenericObject:
      type: object
      additionalProperties: true
    PageData:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
        total:
          type: integer
          format: int64
          example: 0
        page:
          type: integer
          example: 1
        page_size:
          type: integer
          example: 10
      required: [list, total, page, page_size]
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.xxx
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          example: 7200
        user:
          $ref: '#/components/schemas/GenericObject'
      required: [token, token_type, expires_in, user]
    SendVerifyCodeResponse:
      type: object
      properties:
        phone:
          type: string
          example: '13800000000'
        expires_in:
          type: integer
          format: int64
          example: 300
        debug_code:
          type: string
          example: '123456'
      required: [phone, expires_in, debug_code]
    LoginRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800000000'
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: password123
      required: [phone, password]
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800000000'
        password:
          type: string
          minLength: 6
          maxLength: 20
          example: password123
        nickname:
          type: string
          maxLength: 50
          example: 团子妈
      required: [phone, password]
    SendVerifyCodeRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: '^1\d{10}$'
          example: '13800000000'
      required: [phone]
    CreateAdoptionApplicationRequest:
      type: object
      properties:
        pet_id:
          type: integer
          format: int64
        contact_phone:
          type: string
          pattern: '^1\d{10}$'
        experience_desc:
          type: string
        living_condition_desc:
          type: string
      required: [pet_id, contact_phone, experience_desc, living_condition_desc]
    CreatePostRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        content:
          type: string
        category:
          type: string
        images:
          type: array
          items:
            type: string
        tag_ids:
          type: array
          items:
            type: integer
            format: int64
      required: [title, content, category]
    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
      required: [content]
    CreateMerchantReviewRequest:
      type: object
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
      required: [score, content]
    CreateServiceBookingRequest:
      type: object
      properties:
        merchant_id:
          type: integer
          format: int64
        merchant_service_id:
          type: integer
          format: int64
        booking_time:
          type: string
          format: date-time
        contact_name:
          type: string
        contact_phone:
          type: string
          pattern: '^1\d{10}$'
        remark:
          type: string
          nullable: true
      required: [merchant_id, merchant_service_id, booking_time, contact_name, contact_phone]
    AddCartItemRequest:
      type: object
      properties:
        product_id:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
      required: [product_id, quantity]
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
        checked:
          type: boolean
          nullable: true
      required: [quantity]
    CreateOrderRequest:
      type: object
      properties:
        item_ids:
          type: array
          items:
            type: integer
            format: int64
        receiver_name:
          type: string
        receiver_phone:
          type: string
          pattern: '^1\d{10}$'
        receiver_address:
          type: string
        remark:
          type: string
          nullable: true
      required: [item_ids, receiver_name, receiver_phone, receiver_address]
    SavePetRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        type:
          type: string
        breed:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        birthday:
          type: string
          format: date
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        avatar_url:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
      required: [name, type]
    CreatePetVaccineRequest:
      type: object
      properties:
        vaccine_name:
          type: string
        vaccinated_at:
          type: string
          format: date
        next_due_at:
          type: string
          format: date
          nullable: true
        remark:
          type: string
          nullable: true
      required: [vaccine_name, vaccinated_at]
    CreatePetAlbumRequest:
      type: object
      properties:
        image_url:
          type: string
        caption:
          type: string
          nullable: true
      required: [image_url]
    CreatePetWeightRequest:
      type: object
      properties:
        weight:
          type: number
          format: double
          minimum: 0.01
        recorded_at:
          type: string
          format: date-time
          nullable: true
      required: [weight]
    UpdateUserStatusRequest:
      type: object
      properties:
        status:
          type: string
        remark:
          type: string
          nullable: true
      required: [status]
    PostReviewRequest:
      type: object
      properties:
        status:
          type: string
        remark:
          type: string
          nullable: true
      required: [status]
    ReviewAdoptionApplicationRequest:
      type: object
      properties:
        status:
          type: string
        review_remark:
          type: string
          nullable: true
      required: [status]
    UpdateServiceBookingRequest:
      type: object
      properties:
        status:
          type: string
        remark:
          type: string
          nullable: true
      required: [status]
    UpdateOrderRequest:
      type: object
      properties:
        status:
          type: string
        remark:
          type: string
          nullable: true
      required: [status]
    SaveAdoptionPetRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        breed:
          type: string
          nullable: true
        gender:
          type: string
          nullable: true
        age_desc:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        health_status:
          type: string
          nullable: true
        personality:
          type: string
          nullable: true
        adoption_requirements:
          type: string
          nullable: true
        story:
          type: string
          nullable: true
        cover_url:
          type: string
          nullable: true
        status:
          type: string
      required: [name, type, status]
    SaveBannerRequest:
      type: object
      properties:
        title:
          type: string
        image_url:
          type: string
        link_url:
          type: string
          nullable: true
        status:
          type: string
        sort:
          type: integer
          nullable: true
      required: [title, image_url, status]
    SaveMerchantRequest:
      type: object
      properties:
        name:
          type: string
        district:
          type: string
        address:
          type: string
        phone:
          type: string
        business_hours:
          type: string
        status:
          type: string
      required: [name, district, address, phone, business_hours, status]
    SaveMerchantServiceRequest:
      type: object
      properties:
        merchant_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
        duration_minutes:
          type: integer
          minimum: 1
        status:
          type: string
      required: [merchant_id, category_id, name, price, duration_minutes, status]
    SaveProductRequest:
      type: object
      properties:
        category_id:
          type: integer
          format: int64
        name:
          type: string
        subtitle:
          type: string
          nullable: true
        image_url:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
          minimum: 0
        pet_type:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
      required: [category_id, name, image_url, price, stock, status]
    UpdateProductStatusRequest:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SaveServiceCategoryRequest:
      type: object
      properties:
        name:
          type: string
        sort:
          type: integer
          nullable: true
        status:
          type: string
      required: [name, status]
    SaveTagRequest:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        status:
          type: string
        sort:
          type: integer
          nullable: true
      required: [name, type, status]
    SaveRecommendationRequest:
      type: object
      properties:
        biz_type:
          type: string
        biz_id:
          type: integer
          format: int64
        slot_code:
          type: string
        status:
          type: string
        sort:
          type: integer
          nullable: true
      required: [biz_type, biz_id, slot_code, status]
