spring:
  datasource:
    url: jdbc:h2:mem:pet_service_platform_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: test-secret-key-123456789012345678901234567890
  expiration-seconds: 7200

verify-code:
  expiration-seconds: 300
  allow-default-code: true
  default-code: 123456

file:
  storage:
    type: local
    local-path: target/test-uploads/
    access-path: /uploads/
