server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-service-platform
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/pet_service_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
      schema-locations:
        - classpath:sql/schema.sql
      data-locations:
        - classpath:sql/seed.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}

verify-code:
  expiration-seconds: ${VERIFY_CODE_EXPIRATION_SECONDS:300}
  allow-default-code: ${VERIFY_CODE_ALLOW_DEFAULT_CODE:false}
  default-code: ${VERIFY_CODE_DEFAULT_CODE:}

file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-path: ${FILE_STORAGE_LOCAL_PATH:uploads/}
    access-path: ${FILE_STORAGE_ACCESS_PATH:/uploads/}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*,http://10.*:*,http://172.*:*,http://192.168.*:*,https://*.vercel.app,https://pet-service-platform-eta.vercel.app}

ai:
  api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  model: ${AI_MODEL:deepseek-chat}
  system-prompt: ${AI_SYSTEM_PROMPT:你是一名专业、温和的宠物健康顾问。请结合用户提供的上下文，给出清晰、易懂、可执行的建议；如果问题涉及持续呕吐、便血、呼吸困难、高烧、抽搐、误食有毒物等严重情况，请明确建议尽快前往正规宠物医院。}
