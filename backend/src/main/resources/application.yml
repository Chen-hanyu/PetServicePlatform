server:
  port: 8080

spring:
  application:
    name: pet-service-platform
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pet_service_platform?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: replace-with-a-secure-secret-key-1234567890
  expiration-seconds: 7200

verify-code:
  expiration-seconds: 300
  allow-default-code: true
  default-code: 123456

file:
  storage:
    type: local
    local-path: uploads/
    access-path: /uploads/
